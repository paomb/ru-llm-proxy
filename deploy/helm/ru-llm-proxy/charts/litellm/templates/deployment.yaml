# Обслуживающие Pod: LITELLM_JOB_ROLE=serving — без single-owner фоновых заданий.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "litellm.fullname" . }}
  labels:
    {{- include "litellm.selectorLabels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "litellm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "litellm.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/litellm-config.yaml" | sha256sum }}
        {{- include "ru-llm-proxy.vaultAnnotations" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "litellm.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: litellm
          image: {{ include "litellm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/app/litellm_guardrails/entrypoint.sh"]
          args: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
          ports:
            - { containerPort: 4000, name: http }
          env:
            {{- include "litellm.commonEnv" . | nindent 12 }}
            - name: LITELLM_JOB_ROLE
              value: serving
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.preStopSleepSeconds }}"]
          # Прогрев перед включением в Service (#59).
          startupProbe:
            httpGet: { path: /health/liveliness, port: 4000 }
            periodSeconds: 10
            failureThreshold: 30     # до 300 с на холодный старт
          readinessProbe:
            httpGet: { path: /health/readiness, port: 4000 }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health/liveliness, port: 4000 }
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /app/config.yaml, subPath: config.yaml, readOnly: true }
            {{- include "ru-llm-proxy.vaultTokenMount" . | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "litellm.fullname" . }}-config
        {{- include "ru-llm-proxy.vaultTokenVolume" . | nindent 8 }}
