apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ner-triton.fullname" . }}
  labels:
    {{- include "ner-triton.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ner-triton.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ner-triton.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "ner-triton.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: triton
          image: {{ include "ner-triton.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { containerPort: 8000, name: http }
            - { containerPort: 8002, name: metrics }
          env:
            {{- include "ru-llm-proxy.proxyEnv" . | nindent 12 }}
            - name: TRITON_MODEL_INSTANCES
              value: {{ .Values.modelInstances | quote }}
          # Загрузка ONNX и прогрев модели до включения в Service (#59).
          # Тот же скрипт проверки, что и healthcheck в Compose.
          startupProbe:
            exec:
              command: ["python3", "/opt/ru-ner/verify_triton_service.py"]
            periodSeconds: 10
            failureThreshold: 36     # до 360 с на холодную загрузку модели
          readinessProbe:
            exec:
              command: ["python3", "/opt/ru-ner/verify_triton_service.py"]
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet: { path: /v2/health/live, port: 8000 }
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
