{{- if .Values.litellm.enabled }}
# Миграции PostgreSQL LiteLLM — единственное управляемое задание (#59),
# выполняется до rollout приложений. В Pod'ах DISABLE_SCHEMA_UPDATE=true.
# Используется штатный путь LiteLLM: prisma migrate deploy из litellm-proxy-extras
# той же закреплённой версии образа, что и обслуживающие Pod.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ru-llm-proxy.fullname" . }}-db-migrate
  labels:
    {{- include "ru-llm-proxy.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: litellm-migration
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        {{- include "ru-llm-proxy.vaultAnnotations" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.global.imageRegistry }}{{ .Values.litellm.image.repository }}:{{ required "litellm.image.tag обязателен" .Values.litellm.image.tag }}"
          command:
            - sh
            - -c
            - |
              set -eu
              {{- if .Values.global.vault.enabled }}
              # Загрузка секретов из Vault Agent Injector
              for f in /vault/secrets/*.env; do [ -f "$f" ] && . "$f"; done
              {{- end }}
              cd /app
              if [ -d prisma ]; then
                npx prisma migrate deploy --schema=prisma/schema.prisma
              else
                python -c "from litellm_proxy_extras.utils import run_migrations; run_migrations()"
              fi
          env:
            {{- if not .Values.global.vault.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "global.external.postgres.litellm.existingSecret обязателен при vault.enabled=false" .Values.global.external.postgres.litellm.existingSecret }}
                  key: url
            {{- end }}
            - name: DISABLE_SCHEMA_UPDATE
              value: "false"
            - name: LITELLM_MIGRATION_DIR
              value: /tmp/migrations
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits:   { cpu: "1", memory: 2Gi }
          volumeMounts:
            {{- include "ru-llm-proxy.vaultTokenMount" . | nindent 12 }}
      volumes:
        {{- include "ru-llm-proxy.vaultTokenVolume" . | nindent 8 }}
{{- end }}
